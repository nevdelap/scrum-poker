<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" id="themeColor" />

  <meta name="mobile-web-app-capable" content="yes" />

  <meta property="og:title" content="Scrum Poker" />
  <meta property="og:description" content="A simple scrum poker app for agile teams." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Scrum Poker" />
  <meta name="twitter:description" content="A simple scrum poker app for agile teams." />

  <!-- Set theme before first paint to avoid flash -->
  <script>!function () { var t = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.dataset.theme = t; document.getElementById('themeColor').content = t === 'dark' ? '#000000' : '#f5f5f5' }()</script>
  <title>Scrum Poker</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Scrum Poker",
    "url": "https://nevdelap.github.io/scrum-poker/",
    "description": "A simple scrum poker app for agile teams.",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Any",
    "offers": {
      "@type": "Offer",
      "price": "0"
    },
    "author": {
      "@type": "Person",
      "name": "Nev Delap",
      "url": "https://github.com/nevdelap"
    }
  }
  </script>
  <style>
    :root {
      --card-overlay-duration: 0.3s;
    }

    :root {
      color-scheme: dark;
      /* page background behind cards */
      --bg: #000;
      /* header, footer, card backgrounds */
      --bg-surface: #222;
      /* footer top border */
      --border-faint: #444;
      /* header bottom border */
      --border-subtle: #444;
      /* card borders, theme button border */
      --border-mid: #333;
      /* primary text */
      --text: #fff;
      /* subtitle, footer, toolbar button labels */
      --text-muted: #888;
      /* footer link hover */
      --text-faint: #999;
      /* logo, t-shirt sizes, hover/focus highlights */
      --accent: #2563eb;
      /* toolbar button text on hover/active */
      --hover-text: #fff;
      /* card overlay animation */
      --card-overlay-duration: 0.3s;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      /* page background behind cards */
      --bg: #fdfdfd;
      /* header, footer, card backgrounds */
      --bg-surface: #fff;
      /* footer top border */
      --border-faint: #e8e8e8;
      /* header bottom border */
      --border-subtle: #ddd;
      /* card borders, theme button border */
      --border-mid: #ddd;
      /* primary text */
      --text: #111;
      /* subtitle, footer, toolbar button labels */
      --text-muted: #666;
      /* footer link hover */
      --text-faint: #888;
      /* logo, t-shirt sizes, hover/focus highlights */
      --accent: #2563eb;
      /* toolbar button text on hover/active */
      --hover-text: #111;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    #app {
      height: 100vh;
      height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 20px 24px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .logo {
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    .logo span {
      color: var(--accent);
    }

    .subtitle {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    main {
      padding: 22px 24px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .toolbar-btn {
      background: none;
      border: 1px solid var(--border-mid);
      border-radius: 3px;
      color: var(--text-muted);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 6px 12px;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    #themeBtn {
      padding: 7px 9px;
      border-color: transparent;
    }

    .toolbar-btn:focus-visible,
    .toolbar-btn:active {
      background: rgba(37, 99, 235, 0.4);
      border-color: var(--accent);
      color: var(--hover-text);
    }

    @media (hover: hover) {
      .toolbar-btn:hover {
        background: rgba(37, 99, 235, 0.4);
        border-color: var(--accent);
        color: var(--hover-text);
      }
    }

    footer {
      background: var(--bg-surface);
      padding: 16px 24px;
      text-align: center;
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      border-top: 1px solid var(--border-faint);
      text-wrap: balance;
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
    }

    footer .feedback {
      font-size: 11px;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }

    footer .feedback a {
      color: var(--accent);
    }

    @media (hover: hover) {
      footer a:hover {
        color: var(--text-faint);
      }

      footer .feedback a:hover {
        color: var(--accent);
      }
    }

    #cardGrid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 16px;
    }


    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-mid);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: opacity 0.25s, border-color 0.2s, background 0.2s;
    }

    @media (hover: hover) {
      .card:hover {
        border-color: var(--accent);
        background: rgba(37, 99, 235, 0.06);
      }
    }

    .card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .card-number,
    .card-tshirt {
      font-size: clamp(48px, 10vw, 96px);
      font-weight: 600;
      line-height: 1;
      text-align: center;
    }

    .card-number {
      color: var(--text);
    }

    .card-tshirt {
      color: var(--accent);
    }

    .card-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-surface);
      border: 1px solid var(--border-mid);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 5vw, 48px);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      z-index: 100;
      opacity: 0;
      transform: scale(0.05);
      pointer-events: none;
      transition: transform var(--card-overlay-duration) cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-overlay.open {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .card-overlay .card-number,
    .card-overlay .card-tshirt {
      font-size: clamp(216px, 54vw, 480px);
    }

    .card-overlay .card-number {
      font-weight: 700;
    }

    @media (orientation: landscape) {
      #cardGrid {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, 1fr);
      }

      .card {
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }

      .card-number,
      .card-tshirt {
        font-size: clamp(24px, 5vw, 48px);
        width: auto;
      }

      .card-overlay {
        flex-direction: row;
      }

      .card-overlay .card-number,
      .card-overlay .card-tshirt {
        font-size: clamp(108px, 27vw, 240px);
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <header>
      <div class="header-left">
        <div class="logo">Scrum <span>Poker</span></div>
        <div class="subtitle">Agile Planning Tool · v1.1.0</div>
      </div>
      <button type="button" id="themeBtn" class="toolbar-btn"></button>
    </header>

    <main>
      <div id="cardGrid"></div>
    </main>

    <footer>
      <div class="feedback">Found a bug or have a suggestion? <a href="https://github.com/nevdelap/scrum-poker/issues"
          target="_blank" rel="noopener noreferrer">Open an issue to let me know.</a></div>
      © 2026 Nev Delap. Released under the <a href="https://github.com/nevdelap/scrum-poker/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">MIT license</a>.
    </footer>
  </div>

  <div id="cardOverlay" class="card-overlay" role="dialog" aria-modal="true" aria-label="Selected card">
    <div class="card-number" id="overlayNumber"></div>
    <div class="card-tshirt" id="overlayTshirt"></div>
  </div>

  <script>
    // ── Theme ────────────────────────────────────────────────────────────────────
    const ICON_SUN = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>`;
    const ICON_MOON = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;

    function applyTheme(dark) {
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.getElementById('themeBtn').innerHTML = dark ? ICON_SUN : ICON_MOON;
      document.getElementById('themeBtn').setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
      document.getElementById('themeColor').content = dark ? '#000000' : '#f5f5f5';
    }

    let isDark = document.documentElement.dataset.theme !== 'light';
    applyTheme(isDark);

    document.getElementById('themeBtn').addEventListener('click', () => {
      isDark = !isDark;
      applyTheme(isDark);
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      if (!localStorage.getItem('theme')) {
        isDark = e.matches;
        applyTheme(isDark);
      }
    });

    // ── Cards ────────────────────────────────────────────────────────────────────
    const CARDS = [
      { n: 1, t: 'T' },
      { n: 2, t: 'XS' },
      { n: 3, t: 'S' },
      { n: 5, t: 'M' },
      { n: 8, t: 'L' },
      { n: 13, t: 'XL' },
    ];

    let selected = null;
    let animating = false;
    let animationLock = null;

    const overlay = document.getElementById('cardOverlay');
    const overlayNumber = document.getElementById('overlayNumber');
    const overlayTshirt = document.getElementById('overlayTshirt');

    function getTransitionDuration() {
      const style = getComputedStyle(overlay);
      const durations = style.transitionDuration.split(',').map(d => {
        const match = d.trim().match(/^([\d.]+)(s|ms)$/);
        if (match) {
          const value = parseFloat(match[1]);
          return match[2] === 's' ? value * 1000 : value;
        }
        return 0;
      });
      const maxDuration = Math.max(...durations, 0);
      return maxDuration > 0 ? maxDuration : 300;
    }

    function setAnimating() {
      animating = true;
      if (animationLock) clearTimeout(animationLock);
      animationLock = requestAnimationFrame(() => {
        animationLock = setTimeout(() => {
          animating = false;
          animationLock = null;
        }, getTransitionDuration() + 50);
      });
    }

    function renderCards() {
      const grid = document.getElementById('cardGrid');
      CARDS.forEach(card => {
        const el = document.createElement('div');
        el.className = 'card';
        el.setAttribute('role', 'button');
        el.setAttribute('tabindex', '0');
        el.setAttribute('aria-label', `${card.n}, ${card.t}`);
        el.innerHTML = `<div class="card-number">${card.n}</div><div class="card-tshirt">${card.t}</div>`;
        el.addEventListener('click', () => openCard(card, el));
        el.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCard(card, el); }
        });
        grid.appendChild(el);
      });
    }

    function openCard(card, cardEl) {
      if (animating) return;

      const rect = cardEl.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      overlayNumber.textContent = card.n;
      overlayTshirt.textContent = card.t;

      cardEl.blur();
      overlay.style.transformOrigin = `${cx}px ${cy}px`;
      overlay.classList.add('open');
      history.pushState({ cardOpen: true }, '');

      selected = true;
      setAnimating();
    }

    function closeCard() {
      if (!selected || animating) return;
      overlay.classList.remove('open');
      selected = null;
      setAnimating();
    }

    window.addEventListener('popstate', () => closeCard());
    overlay.addEventListener('click', () => { closeCard(); history.back(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeCard(); history.back(); } });

    renderCards();
  </script>
</body>

</html>
